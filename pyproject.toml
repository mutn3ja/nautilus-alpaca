[project]
name = "nautilus-alpaca"
version = "0.1.0"
description = "Alpaca Markets adapter for nautilus-trader"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nautilus-trader>=1.210.0",
    "alpaca-py>=0.38.0",
    "msgspec>=0.19.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring live paper trading credentials",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nautilus_alpaca"]
